# SPDX-License-Identifier: GPL-3.0-only
name: Fuzz

on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-zig
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: run each target for 10 minutes
        run: |
          set -euo pipefail
          cargo fuzz build
          fuzz/seed-restore.sh
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" -- -max_total_time=600
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
