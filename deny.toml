# SPDX-License-Identifier: GPL-3.0-only
#
# cargo deny check licenses bans sources, run on the workspace and again with
# --manifest-path fuzz/Cargo.toml. Advisories run weekly (advisories.yml).

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # libfuzzer-sys carries LLVM's libFuzzer.
    "NCSA",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"
include-dev = true

[licenses.private]
# Perch's own crates are publish = false and GPL-3.0-only.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
