[package]
name = "perch-testprogs"
description = "Programs Perch's integration tests run inside sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
test-hooks = ["perch/test-hooks"]

[dependencies]
perch = { path = "../perch" }
serde_json = "1"
# reedline-prompt: the line editor Raven's console uses, at Raven's version.
reedline = { version = "=0.52.1", default-features = false }
crossterm = { version = "0.29", default-features = false }
