# SPDX-License-Identifier: GPL-3.0-only
#
# Every Zig package the shipped perch-vt build fetches, as listed in the local
# package directory after `zig build` with the shipped flags
# (-Doptimize=ReleaseSafe -Dcpu=baseline -Dsimd=false
# -Dvt-features=-kitty-graphics). scripts/zig-package-check fails on any
# package not listed here.
#
# use = "linked": code from the package is in libperch-vt.a, and NOTICE covers
# it. use = "build-time": fetched by the build but nothing from it is linked.
# Ghostty's build.zig fetches zlib's source and its color themes as lazy
# dependencies even though perch-vt builds neither. libperch-vt.a holds only
# perch-vt's Zig compilation unit (perch-vt, ghostty-vt, uucode's tables and
# Zig's standard library) and compiler_rt.

